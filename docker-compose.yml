services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-copilot-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: incident-copilot-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./sample-data:/data:ro
      - ./backend/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: